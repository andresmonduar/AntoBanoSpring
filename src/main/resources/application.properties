# Configuracion de la aplicacion web AntoBano
spring.application.name=AntoBanoSpring

# Puerto donde correra la pagina web
server.port=8080

# Conexion a la base de datos MySQL en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/db_modulo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Configuracion de JPA/Hibernate para respetar las tablas existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
